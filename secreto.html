<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR LITTLE CORNER ♡ - Página Secreta</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/secreto.css">
</head>
<body class="olc-app-layout secret-page-body">
  <div id="olc-nav-container"></div>

  <main class="olc-main">
    <header class="secret-header">
      <h1 class="secret-title">Nosso Baú Secreto 🗝️</h1>
      <p class="secret-subtitle">um refúgio íntimo reservado apenas para as nossas almas ♡</p>
    </header>

    <!-- O Cadeado do Nosso Amor -->
    <div class="love-padlock-container">
      <div class="love-padlock" id="love-padlock" title="Toque no cadeado para selar nosso amor!">
        🔒
      </div>
      <p style="font-family: var(--font-handwriting); font-size: 1.3rem; color: #E5BCCD; margin-top: 14px;">
        Toque no cadeado para reafirmar nossos votos eternos ♡
      </p>
      <button type="button" class="olc-btn olc-btn-primary" id="btn-add-vow" style="margin-top: 12px;">
        <span>Guardar Novo Voto ou Promessa</span> 🗝️
      </button>
    </div>

    <!-- Grade de Votos e Cápsulas do Tempo -->
    <div class="secret-vault-grid" id="secret-vault-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
        <span class="olc-spinner"></span>
        <p style="color: #CBB2C5; margin-top: 10px;">Abrindo nosso cofre secreto...</p>
      </div>
    </div>
  </main>

  <!-- MODAL: GUARDAR NOVO VOTO -->
  <div class="olc-modal-overlay" id="new-vow-modal">
    <div class="olc-modal-card" style="max-width: 520px; background: #2E2036; color: #FFF; border-color: #5A3F66;">
      <div class="olc-modal-header" style="border-color: rgba(255,255,255,0.1);">
        <span class="olc-modal-icon">🗝️</span>
        <h3 style="font-family: var(--font-title); color: #FFDEEB; margin: 0;">Guardar Segredo do Coração</h3>
        <button type="button" class="olc-modal-close" id="new-vow-modal-close" style="color: #DDD;">✕</button>
      </div>

      <form id="new-vow-form">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; color: #E5BCCD;">Título da Memória:</label>
          <input type="text" id="vow-title" class="olc-input" required placeholder="Ex: Minha Promessa para Você no Futuro" maxlength="80" style="background: #3B2A46; color: #FFF; border-color: #6C4B7D;">
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; color: #E5BCCD;">Categoria Secreta:</label>
          <select id="vow-category" class="olc-select" required style="background: #3B2A46; color: #FFF; border-color: #6C4B7D;">
            <option value="vow">Voto de Amor 💍</option>
            <option value="promise">Promessa Eterna 🕊️</option>
            <option value="letter">Carta Secreta 🗝️</option>
            <option value="dream">Sonho para o Futuro ✨</option>
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; color: #E5BCCD;">Palavras do Coração:</label>
          <textarea id="vow-content" class="olc-textarea font-handwriting" style="min-height: 140px; font-size: 1.35rem; background: #3B2A46; color: #FFF; border-color: #6C4B7D;" required placeholder="Escreva aqui aquilo que pertence apenas a nós dois... ♡"></textarea>
        </div>

        <button type="submit" class="olc-btn olc-btn-primary" style="width: 100%;">
          Trancar no Cofre para Sempre ♡
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/secreto.js"></script>
</body>
</html>
